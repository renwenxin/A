<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股复盘选股系统</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- ====== 左侧导航栏 ====== -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">📊</span>
            <div class="brand-text">
                <span class="brand-title">竞价交易系统</span>
                <span class="brand-sub">Auction Trading</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <span class="nav-section">竞价交易流程</span>
            <a href="/" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">首页</span>
            </a>
            <a href="/breakout_v3" class="nav-item {% if request.endpoint == 'breakout_v3' %}active{% endif %}">
                <span class="nav-icon">🚀</span>
                <span class="nav-label">启动突破</span>
                <span class="nav-badge" style="background:#7c3aed;">V3</span>
            </a>
            <!-- hidden: 选股面板 + 竞价分析 + V4监控
            <a href="/screening" class="nav-item {% if request.endpoint == 'screening' %}active{% endif %}">
                <span class="nav-icon">⏰</span>
                <span class="nav-label">盘前准备</span>
                <span class="nav-badge">9:15</span>
            </a>
            <a href="/auction_analysis" class="nav-item {% if request.endpoint == 'auction_analysis' %}active{% endif %}">
                <span class="nav-icon">🔔</span>
                <span class="nav-label">竞价分析</span>
                <span class="nav-badge" style="background:#d97706;">9:25</span>
            </a>
            <a href="/v4_monitor" class="nav-item {% if request.endpoint == 'v4_monitor' %}active{% endif %}">
                <span class="nav-icon">📋</span>
                <span class="nav-label">V4 监控手册</span>
                <span class="nav-badge" style="background:#059669;">V4</span>
            </a>
            -->
            <a href="/sim_portfolio" class="nav-item {% if request.endpoint == 'sim_portfolio' %}active{% endif %}">
                <span class="nav-icon">💼</span>
                <span class="nav-label">模拟持仓</span>
            </a>
            <a href="/review" class="nav-item {% if request.endpoint == 'review' %}active{% endif %}">
                <span class="nav-icon">📊</span>
                <span class="nav-label">复盘分析</span>
            </a>
            <a href="/regime_picks" class="nav-item {% if request.endpoint == 'regime_picks' %}active{% endif %}">
                <span class="nav-icon">🎯</span>
                <span class="nav-label">行情诊断</span>
            </a>
            <a href="/fund_screening" class="nav-item {% if request.endpoint == 'fund_screening' %}active{% endif %}">
                <span class="nav-icon">💰</span>
                <span class="nav-label">基金挑选</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <span class="footer-status">● 系统就绪</span>
            <span class="footer-version">v2.0</span>
        </div>
    </aside>

    <!-- ====== 主内容区 ====== -->
    <div class="main-wrapper">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
