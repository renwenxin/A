{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="/static/chart/style.css">
<div class="chart-page" id="chartPage">
    <!-- 顶部股票标题栏 -->
    <div class="chart-toolbar" id="chartToolbar">
        <span class="stock-code" id="toolbarCode">{{ default_code }}</span>
        <span class="stock-name" id="toolbarName">--</span>
        <span class="stock-price" id="toolbarPrice">--</span>
        <span class="stock-change" id="toolbarChange">--</span>

        <div class="layout-btns" id="layoutBtns">
            <button class="layout-btn active" data-layout="1" title="单屏 (1)">&#x229E;</button>
            <button class="layout-btn" data-layout="2" title="2分屏 (2)">&#x2B7F;</button>
            <button class="layout-btn" data-layout="4" title="4分屏 (4)">&#x2B7B;</button>
        </div>
        <button class="theme-btn" id="themeToggle" title="切换主题 (T)">&#x1F313;</button>

        <div class="drawing-tools" id="drawingTools">
            <button class="dt-btn" data-tool="trend" title="趋势线">↗</button>
            <button class="dt-btn" data-tool="horizontal" title="水平线">━</button>
            <button class="dt-btn" data-tool="rectangle" title="矩形">▭</button>
            <button class="dt-btn" data-tool="fibonacci" title="斐波那契">%</button>
            <button class="dt-btn" data-tool="" title="取消">✕</button>
            <button class="dt-btn" id="dtUndo" title="撤销">↩</button>
            <button class="dt-btn" id="dtClear" title="清除">🗑</button>
        </div>

        <div class="period-switcher" id="periodSwitcher">
            <button class="period-btn" data-period="5min">5分</button>
            <button class="period-btn" data-period="15min">15分</button>
            <button class="period-btn" data-period="30min">30分</button>
            <button class="period-btn" data-period="60min">60分</button>
            <button class="period-btn active" data-period="daily">日线</button>
            <button class="period-btn" data-period="intra">分时</button>
        </div>
    </div>

    <!-- 三列布局 -->
    <div class="chart-layout">
        <!-- 左列: 自选列表 (Phase 2 实现) -->
        <aside class="chart-sidebar-left" id="sidebarLeft"></aside>

        <!-- 中列: 图表 -->
        <main class="chart-main" id="chartMain">
            <!-- lightweight-charts 动态创建 chart div -->
        </main>

        <!-- 右列: 工具面板 (Phase 2 实现) -->
        <aside class="chart-sidebar-right" id="sidebarRight">
            <div class="tb-section" id="strategyMarkers">
                <div class="tb-section-title">🎯 策略事件</div>
                <p class="placeholder-text">加载中...</p>
            </div>
        </aside>
    </div>
</div>

<!-- lightweight-charts CDN -->
<script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>

<!-- ES 模块入口 -->
<script type="module" src="/static/chart/app.js"></script>
{% endblock %}
